import groovy.json.JsonSlurper

def mlKitSuiteReadCordovaAndroidMajor() {
    def packageCandidates = [
        rootProject.file('../../node_modules/cordova-android/package.json'),
        rootProject.file('../node_modules/cordova-android/package.json')
    ]
    for (def packageFile : packageCandidates) {
        if (!packageFile.exists()) {
            continue
        }
        def platformPackage = new JsonSlurper().parse(packageFile)
        def matcher = (platformPackage.version ?: '').toString() =~ /^(\d+)\./
        if (matcher.find()) {
            return Integer.parseInt(matcher.group(1))
        }
    }

    def configFile = rootProject.file('cdv-gradle-config.json')
    if (configFile.exists()) {
        def config = new JsonSlurper().parse(configFile)
        def knownToolchains = [
            '7.2.1:32': 11,
            '7.4.2:33': 12,
            '8.3.0:34': 13,
            '8.7.3:35': 14,
            '8.10.1:36': 15
        ]
        def major = knownToolchains["${config.AGP_VERSION}:${config.SDK_VERSION}"]
        if (major != null) {
            return major
        }
    }
    throw new GradleException(
        'cordova-plugin-mlkit-suite: unable to determine the installed cordova-android version.'
    )
}

def mlKitSuiteReadModelDelivery() {
    def stateCandidates = [
        rootProject.file('../../plugins/fetch.json'),
        rootProject.file('../plugins/fetch.json'),
        rootProject.file('../../package.json'),
        rootProject.file('../package.json')
    ]
    for (def stateFile : stateCandidates) {
        if (!stateFile.exists()) {
            continue
        }
        try {
            def state = new JsonSlurper().parse(stateFile)
            def pluginState = stateFile.name == 'fetch.json'
                ? state['cordova-plugin-mlkit-suite']
                : state.cordova?.plugins?.get('cordova-plugin-mlkit-suite')
            def selected = pluginState?.variables?.ANDROID_MLKIT_MODEL_DELIVERY
                ?: pluginState?.ANDROID_MLKIT_MODEL_DELIVERY
            if (selected != null && !selected.toString().trim().isEmpty()) {
                return selected.toString().trim()
            }
        } catch (Exception ignored) {
            // A malformed Cordova state file is handled by the normal Cordova
            // tooling. Keep looking for another persisted source here.
        }
    }
    return 'bundled'
}

def cameraXByCordova = [
    11: '1.1.0',
    12: '1.2.3',
    13: '1.4.2',
    14: '1.5.2',
    15: '1.6.0'
]
def webKitByCordova = [
    11: '1.4.0',
    12: '1.6.0',
    13: '1.6.0',
    14: '1.12.1',
    15: '1.14.0'
]

def cordovaAndroidMajor = mlKitSuiteReadCordovaAndroidMajor()
def modelDelivery = mlKitSuiteReadModelDelivery()
if (!(modelDelivery in ['bundled', 'play-services'])) {
    throw new GradleException(
        "cordova-plugin-mlkit-suite: invalid Android model delivery '${modelDelivery}'. " +
        'Use bundled or play-services.'
    )
}
def cameraXVersion = project.findProperty('mlKitSuiteCameraXVersion')?.toString()
def mlKitFaceVersion = project.findProperty('mlKitSuiteFaceDetectionVersion')?.toString()
if (cameraXVersion == null || cameraXVersion.trim().isEmpty()) {
    cameraXVersion = cameraXByCordova[cordovaAndroidMajor]
}
if (cameraXVersion == null) {
    throw new GradleException(
        "cordova-plugin-mlkit-suite: cordova-android ${cordovaAndroidMajor} is not supported. " +
        'Supported versions: 11, 12, 13, 14 and 15.'
    )
}
if (mlKitFaceVersion == null || mlKitFaceVersion.trim().isEmpty()) {
    // ML Kit 16.1.6+ pulls AppCompat 1.6.1, whose AAR metadata requires
    // compileSdk 33. cordova-android 11 intentionally compiles with SDK 32,
    // so it uses the last compatible bundled face model.
    mlKitFaceVersion = cordovaAndroidMajor == 11 ? '16.1.5' : '16.1.7'
}

logger.lifecycle(
    "cordova-plugin-mlkit-suite: cordova-android ${cordovaAndroidMajor}, " +
    "CameraX ${cameraXVersion}, model delivery ${modelDelivery}, " +
    (modelDelivery == 'bundled'
        ? "ML Kit Face Detection ${mlKitFaceVersion}, Text Recognition 16.0.1, Barcode Scanning 17.2.0, "
        : 'Play services Face Detection 17.1.0, Text Recognition 19.0.1, Barcode Scanning 18.3.1, ') +
    'Document Scanner 16.0.0'
)

android {
    defaultConfig {
        manifestPlaceholders.mlKitSuiteModelDelivery = modelDelivery
        if (modelDelivery == 'play-services') {
            manifestPlaceholders.mlKitSuiteDependencyMetadataName =
                'com.google.mlkit.vision.DEPENDENCIES'
            manifestPlaceholders.mlKitSuiteDependencyMetadataValue = 'face,barcode,ocr'
        } else {
            // Keep the manifest element inert in bundled mode. A placeholder is
            // used because Cordova plugin.xml does not support conditional XML.
            manifestPlaceholders.mlKitSuiteDependencyMetadataName =
                'com.andreszs.plugins.mlkitsuite.BUNDLED_MODE'
            manifestPlaceholders.mlKitSuiteDependencyMetadataValue = 'true'
        }
    }
}

// The document scanner currently resolves ML Kit Common 18.11.0, which in
// turn requests AndroidX releases whose AAR metadata requires compileSdk 33.
// cordova-android 11 intentionally compiles with SDK 32, so keep its AndroidX
// graph on the compatible line used by that Cordova release. This does not
// change the app's minSdk or affect cordova-android 12+.
if (cordovaAndroidMajor == 11) {
    configurations.all {
        resolutionStrategy {
            force 'androidx.appcompat:appcompat:1.4.2'
            force 'androidx.appcompat:appcompat-resources:1.4.2'
            force 'androidx.activity:activity:1.5.1'
            force 'androidx.core:core:1.8.0'
            force 'androidx.core:core-ktx:1.8.0'
            force 'androidx.annotation:annotation-experimental:1.2.0'
        }
    }
}

dependencies {
    implementation "androidx.camera:camera-core:${cameraXVersion}"
    implementation "androidx.camera:camera-camera2:${cameraXVersion}"
    implementation "androidx.camera:camera-lifecycle:${cameraXVersion}"
    implementation("androidx.camera:camera-view:${cameraXVersion}") {
        exclude group: 'androidx.camera', module: 'camera-video'
    }
    implementation 'androidx.exifinterface:exifinterface:1.3.2'
    implementation 'com.google.guava:listenablefuture:1.0'
    if (modelDelivery == 'play-services') {
        implementation 'com.google.android.gms:play-services-mlkit-face-detection:17.1.0'
        implementation 'com.google.android.gms:play-services-mlkit-barcode-scanning:18.3.1'
        implementation 'com.google.android.gms:play-services-mlkit-text-recognition:19.0.1'
    } else {
        implementation "com.google.mlkit:face-detection:${mlKitFaceVersion}"
        implementation 'com.google.mlkit:barcode-scanning:17.2.0'
        implementation 'com.google.mlkit:text-recognition:16.0.1'
    }
    implementation 'com.google.android.gms:play-services-mlkit-document-scanner:16.0.0'
    compileOnly "androidx.webkit:webkit:${webKitByCordova[cordovaAndroidMajor]}"
}

