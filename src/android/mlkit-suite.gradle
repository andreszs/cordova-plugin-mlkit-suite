import groovy.json.JsonSlurper

def mlKitSuiteReadCordovaAndroidMajor() {
    def packageCandidates = [
        rootProject.file('../../node_modules/cordova-android/package.json'),
        rootProject.file('../node_modules/cordova-android/package.json')
    ]
    for (def packageFile : packageCandidates) {
        if (!packageFile.exists()) {
            continue
        }
        def platformPackage = new JsonSlurper().parse(packageFile)
        def matcher = (platformPackage.version ?: '').toString() =~ /^(\d+)\./
        if (matcher.find()) {
            return Integer.parseInt(matcher.group(1))
        }
    }

    def configFile = rootProject.file('cdv-gradle-config.json')
    if (configFile.exists()) {
        def config = new JsonSlurper().parse(configFile)
        def knownToolchains = [
            '7.4.2:33': 12,
            '8.3.0:34': 13,
            '8.7.3:35': 14,
            '8.10.1:36': 15
        ]
        def major = knownToolchains["${config.AGP_VERSION}:${config.SDK_VERSION}"]
        if (major != null) {
            return major
        }
    }
    throw new GradleException(
        'cordova-plugin-mlkit-suite: unable to determine the installed cordova-android version.'
    )
}

def mlKitSuiteReadPluginVariable(String variableName, String fallback) {
    def stateCandidates = [
        rootProject.file('../../plugins/fetch.json'),
        rootProject.file('../plugins/fetch.json'),
        rootProject.file('../../package.json'),
        rootProject.file('../package.json')
    ]
    for (def stateFile : stateCandidates) {
        if (!stateFile.exists()) {
            continue
        }
        try {
            def state = new JsonSlurper().parse(stateFile)
            def pluginState = stateFile.name == 'fetch.json'
                ? state['cordova-plugin-mlkit-suite']
                : state.cordova?.plugins?.get('cordova-plugin-mlkit-suite')
            def selected = pluginState?.variables?.get(variableName)
                ?: pluginState?.get(variableName)
            if (selected != null && !selected.toString().trim().isEmpty()) {
                return selected.toString().trim()
            }
        } catch (Exception ignored) {
            // A malformed Cordova state file is handled by the normal Cordova
            // tooling. Keep looking for another persisted source here.
        }
    }
    return fallback
}

def mlKitSuiteNormalizeMode(String rawValue, String variableName) {
    def value = rawValue == null ? '' : rawValue.trim().toLowerCase()
    if (value == 'play-services') {
        // Backward-compatible alias used by the former aggregate variable.
        return 'install-time'
    }
    if (!(value in ['bundled', 'install-time', 'first-use'])) {
        throw new GradleException(
            "cordova-plugin-mlkit-suite: invalid ${variableName} value '${rawValue}'. " +
            'Use bundled, install-time or first-use.'
        )
    }
    return value
}

def cameraXByCordova = [
    12: '1.2.3',
    13: '1.4.2',
    14: '1.5.2',
    15: '1.6.0'
]
def webKitByCordova = [
    12: '1.6.0',
    13: '1.6.0',
    14: '1.12.1',
    15: '1.14.0'
]

def cordovaAndroidMajor = mlKitSuiteReadCordovaAndroidMajor()
def defaultMode = mlKitSuiteNormalizeMode(
    mlKitSuiteReadPluginVariable('ANDROID_MLKIT_MODEL_DELIVERY', 'install-time'),
    'ANDROID_MLKIT_MODEL_DELIVERY'
)
def readModuleMode = { String variableName ->
    def selected = mlKitSuiteReadPluginVariable(variableName, 'inherit')
    return selected == null || selected.trim().isEmpty() || selected.equalsIgnoreCase('inherit')
        ? defaultMode
        : mlKitSuiteNormalizeMode(selected, variableName)
}
def faceMode = readModuleMode('ANDROID_MLKIT_FACE_MODE')
def barcodeMode = readModuleMode('ANDROID_MLKIT_BARCODE_MODE')
def ocrMode = readModuleMode('ANDROID_MLKIT_OCR_MODE')
def installTimeModules = []
if (faceMode == 'install-time') installTimeModules.add('face')
if (barcodeMode == 'install-time') installTimeModules.add('barcode')
if (ocrMode == 'install-time') installTimeModules.add('ocr')

if (cordovaConfig.MIN_SDK_VERSION < 24) {
    cordovaConfig.MIN_SDK_VERSION = 24
}
def cameraXVersion = project.findProperty('mlKitSuiteCameraXVersion')?.toString()
def mlKitFaceVersion = project.findProperty('mlKitSuiteFaceDetectionVersion')?.toString()
if (cameraXVersion == null || cameraXVersion.trim().isEmpty()) {
    cameraXVersion = cameraXByCordova[cordovaAndroidMajor]
}
if (cameraXVersion == null) {
    throw new GradleException(
        "cordova-plugin-mlkit-suite: cordova-android ${cordovaAndroidMajor} is not supported. " +
        'Supported versions: 12, 13, 14 and 15.'
    )
}
if (mlKitFaceVersion == null || mlKitFaceVersion.trim().isEmpty()) {
    mlKitFaceVersion = '16.1.7'
}

logger.lifecycle(
    "cordova-plugin-mlkit-suite: cordova-android ${cordovaAndroidMajor}, " +
    "CameraX ${cameraXVersion}, " +
    "Face ${faceMode} (${faceMode == 'bundled' ? mlKitFaceVersion : '17.1.0'}), " +
    "Barcode ${barcodeMode} (${barcodeMode == 'bundled' ? '17.2.0' : '18.3.1'}), " +
    "OCR ${ocrMode} (${ocrMode == 'bundled' ? '16.0.1' : '19.0.1'}), " +
    'Document Scanner 16.0.0'
)

android {
    defaultConfig {
        manifestPlaceholders.mlKitSuiteFaceMode = faceMode
        manifestPlaceholders.mlKitSuiteBarcodeMode = barcodeMode
        manifestPlaceholders.mlKitSuiteOcrMode = ocrMode
        if (!installTimeModules.isEmpty()) {
            manifestPlaceholders.mlKitSuiteDependencyMetadataName =
                'com.google.mlkit.vision.DEPENDENCIES'
            manifestPlaceholders.mlKitSuiteDependencyMetadataValue = installTimeModules.join(',')
        } else {
            // Keep the manifest element inert when no module uses install-time
            // prefetch. Cordova plugin.xml does not support conditional XML.
            manifestPlaceholders.mlKitSuiteDependencyMetadataName =
                'com.andreszs.plugins.mlkitsuite.NO_INSTALL_TIME_MODELS'
            manifestPlaceholders.mlKitSuiteDependencyMetadataValue = 'true'
        }
    }
}

dependencies {
    implementation "androidx.camera:camera-core:${cameraXVersion}"
    implementation "androidx.camera:camera-camera2:${cameraXVersion}"
    implementation "androidx.camera:camera-lifecycle:${cameraXVersion}"
    implementation("androidx.camera:camera-view:${cameraXVersion}") {
        exclude group: 'androidx.camera', module: 'camera-video'
    }
    implementation 'androidx.exifinterface:exifinterface:1.3.2'
    implementation 'com.google.guava:listenablefuture:1.0'
    if (faceMode == 'bundled') {
        implementation "com.google.mlkit:face-detection:${mlKitFaceVersion}"
    } else {
        implementation 'com.google.android.gms:play-services-mlkit-face-detection:17.1.0'
    }
    if (barcodeMode == 'bundled') {
        implementation 'com.google.mlkit:barcode-scanning:17.2.0'
    } else {
        implementation 'com.google.android.gms:play-services-mlkit-barcode-scanning:18.3.1'
    }
    if (ocrMode == 'bundled') {
        implementation 'com.google.mlkit:text-recognition:16.0.1'
    } else {
        implementation 'com.google.android.gms:play-services-mlkit-text-recognition:19.0.1'
    }
    implementation 'com.google.android.gms:play-services-mlkit-document-scanner:16.0.0'
    compileOnly "androidx.webkit:webkit:${webKitByCordova[cordovaAndroidMajor]}"
}

