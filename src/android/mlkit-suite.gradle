import groovy.json.JsonSlurper

def mlKitSuiteReadCordovaAndroidMajor() {
    def packageCandidates = [
        rootProject.file('../../node_modules/cordova-android/package.json'),
        rootProject.file('../node_modules/cordova-android/package.json')
    ]
    for (def packageFile : packageCandidates) {
        if (!packageFile.exists()) {
            continue
        }
        def platformPackage = new JsonSlurper().parse(packageFile)
        def matcher = (platformPackage.version ?: '').toString() =~ /^(\d+)\./
        if (matcher.find()) {
            return Integer.parseInt(matcher.group(1))
        }
    }

    def configFile = rootProject.file('cdv-gradle-config.json')
    if (configFile.exists()) {
        def config = new JsonSlurper().parse(configFile)
        def knownToolchains = [
            '7.2.1:32': 11,
            '7.4.2:33': 12,
            '8.3.0:34': 13,
            '8.7.3:35': 14,
            '8.10.1:36': 15
        ]
        def major = knownToolchains["${config.AGP_VERSION}:${config.SDK_VERSION}"]
        if (major != null) {
            return major
        }
    }
    throw new GradleException(
        'cordova-plugin-mlkit-suite: unable to determine the installed cordova-android version.'
    )
}

def cameraXByCordova = [
    11: '1.1.0',
    12: '1.2.3',
    13: '1.4.2',
    14: '1.5.2',
    15: '1.6.0'
]
def webKitByCordova = [
    11: '1.4.0',
    12: '1.6.0',
    13: '1.6.0',
    14: '1.12.1',
    15: '1.14.0'
]

def cordovaAndroidMajor = mlKitSuiteReadCordovaAndroidMajor()
def cameraXVersion = project.findProperty('mlKitSuiteCameraXVersion')?.toString()
def mlKitFaceVersion = project.findProperty('mlKitSuiteFaceDetectionVersion')?.toString()
if (cameraXVersion == null || cameraXVersion.trim().isEmpty()) {
    cameraXVersion = cameraXByCordova[cordovaAndroidMajor]
}
if (cameraXVersion == null) {
    throw new GradleException(
        "cordova-plugin-mlkit-suite: cordova-android ${cordovaAndroidMajor} is not supported. " +
        'Supported versions: 11, 12, 13, 14 and 15.'
    )
}
if (mlKitFaceVersion == null || mlKitFaceVersion.trim().isEmpty()) {
    // ML Kit 16.1.6+ pulls AppCompat 1.6.1, whose AAR metadata requires
    // compileSdk 33. cordova-android 11 intentionally compiles with SDK 32,
    // so it uses the last compatible bundled face model.
    mlKitFaceVersion = cordovaAndroidMajor == 11 ? '16.1.5' : '16.1.7'
}

logger.lifecycle(
    "cordova-plugin-mlkit-suite: cordova-android ${cordovaAndroidMajor}, " +
    "CameraX ${cameraXVersion}, ML Kit Face Detection ${mlKitFaceVersion}"
)

dependencies {
    implementation "androidx.camera:camera-core:${cameraXVersion}"
    implementation "androidx.camera:camera-camera2:${cameraXVersion}"
    implementation "androidx.camera:camera-lifecycle:${cameraXVersion}"
    implementation("androidx.camera:camera-view:${cameraXVersion}") {
        exclude group: 'androidx.camera', module: 'camera-video'
    }
    implementation 'androidx.exifinterface:exifinterface:1.3.2'
    implementation 'com.google.guava:listenablefuture:1.0'
    implementation "com.google.mlkit:face-detection:${mlKitFaceVersion}"
    implementation 'com.google.mlkit:barcode-scanning:17.2.0'
    compileOnly "androidx.webkit:webkit:${webKitByCordova[cordovaAndroidMajor]}"
}

